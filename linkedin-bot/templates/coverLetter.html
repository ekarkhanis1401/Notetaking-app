<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cover Letter – {{NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 11pt;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Letterhead ── */
    header {
      border-bottom: 2px solid #1a365d;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h1.name {
      font-size: 19pt;
      font-weight: 700;
      color: #1a365d;
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.3px;
    }

    .subtitle {
      font-size: 10pt;
      color: #4a5568;
      font-family: 'Arial', sans-serif;
      margin-top: 2px;
    }

    .contact-info {
      font-size: 9.5pt;
      color: #555;
      margin-top: 5px;
      font-family: 'Arial', sans-serif;
    }

    .contact-info a { color: #2b6cb0; text-decoration: none; }

    /* ── Meta ── */
    .meta {
      margin-bottom: 22px;
      font-size: 10.5pt;
      color: #2d3748;
    }

    .meta .date { color: #718096; font-size: 10pt; margin-bottom: 14px; }

    .meta .job-ref {
      background: #ebf8ff;
      border-left: 3px solid #2b6cb0;
      padding: 6px 10px;
      font-size: 10pt;
      color: #2c5282;
      border-radius: 0 4px 4px 0;
      display: inline-block;
    }

    /* ── Body ── */
    .letter-body p {
      margin-bottom: 14px;
      font-size: 11pt;
      color: #2d3748;
    }

    /* ── Signature ── */
    .signature {
      margin-top: 24px;
      font-size: 11pt;
      color: #1a202c;
    }

    .signature .sig-name {
      margin-top: 8px;
      font-weight: 700;
      font-size: 12pt;
      color: #1a365d;
      font-family: 'Georgia', serif;
    }

    .signature .sig-title {
      font-size: 10pt;
      color: #718096;
      font-family: 'Arial', sans-serif;
    }

    @media print {
      body { font-size: 10.5pt; }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="name">{{NAME}}</h1>
    <div class="subtitle">{{TITLE}}</div>
    <div class="contact-info">{{EMAIL}} &nbsp;·&nbsp; {{PHONE}}</div>
  </header>

  <div class="meta">
    <div class="date">{{DATE}}</div>
    <div class="job-ref">Re: {{JOB_TITLE}} · {{COMPANY}}</div>
  </div>

  <div class="letter-body">
    {{BODY}}
  </div>

  <div class="signature">
    <div>Warm regards,</div>
    <div class="sig-name">{{NAME}}</div>
    <div class="sig-title">{{TITLE}}</div>
  </div>
</body>
</html>
